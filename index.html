<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Attendance App</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="container">

    <h1>Attendance</h1>



    <!-- DATE -->
    <div class="date-container">

      <label>Select Date</label>

      <input
        type="date"
        id="attendanceDate"
      >

    </div>



    <!-- STUDENTS -->
    <div id="students"></div>



    <!-- SAVE BUTTON -->
    <button id="saveBtn">

      SAVE DATA

    </button>



    <!-- STATUS -->
    <div id="saveStatus"></div>

  </div>



  <!-- SCRIPTS -->
  <script src="js/config.js"></script>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
